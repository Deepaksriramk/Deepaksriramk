name: Generate GitHub Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300ff00&color_dots=white,%23d8f3dc,%2395d5a6,%2352b788,%231b7f4d&color_background=white
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300ff00&color_dots=%231a1a1a,%23d8f3dc,%2395d5a6,%2352b788,%231b7f4d&color_background=%231a1a1a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
